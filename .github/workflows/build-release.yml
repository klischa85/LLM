name: Build and Release Android LLM APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Clone and patch llama.cpp (b3600)
        run: |
          git clone --depth 1 --branch b3600 https://github.com/ggerganov/llama.cpp.git android/app/src/main/cpp/llama_cpp
          python3 scripts/patch_llama_cpp.py android/app/src/main/cpp/llama_cpp

      - name: Configure Android SDK, NDK, and CMake
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.1.10909125" \
            "cmake;3.22.1"

      - name: Decode permanent release signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Missing Android release signing secrets (ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD)!"
            exit 1
          fi
          KEYSTORE_PATH="${RUNNER_TEMP}/llmnotes-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -E "Alias name:|Certificate fingerprint|SHA256" || true
          echo "ANDROID_KEYSTORE_FILE=${KEYSTORE_PATH}" >> "$GITHUB_ENV"

      - name: Build Release APK with Gradle
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log || {
            echo "=== GRADLE BUILD FAILED ==="
            grep -E "error:|FAILED|exception|Exception" build.log | tail -n 40 | while IFS= read -r line; do
              echo "::error title=BuildError::$line"
            done
            tail -n 25 build.log | while IFS= read -r line; do
              echo "::error title=GradleTail::$line"
            done
            exit 1
          }

      - name: Package versioned APK and SHA-256
        id: find_apk
        run: |
          RAW_APK=$(find android/app/build/outputs/apk/release -name "*.apk" -type f | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No release APK file found in build outputs!"
            find android/app/build/outputs -maxdepth 4 || true
            exit 1
          fi

          VERSION_TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            VERSION_TAG="v$(grep -oE 'versionName\s*=\s*"[^"]+"' android/app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          fi

          mkdir -p release-dist
          OUT_APK="release-dist/LLMNotes-${VERSION_TAG}.apk"
          cp "$RAW_APK" "$OUT_APK"
          (cd release-dist && sha256sum "LLMNotes-${VERSION_TAG}.apk" > "LLMNotes-${VERSION_TAG}.apk.sha256")

          echo "Built asset: $OUT_APK"
          ls -lh release-dist/
          cat "release-dist/LLMNotes-${VERSION_TAG}.apk.sha256"

          echo "apk_path=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${OUT_APK}.sha256" >> "$GITHUB_OUTPUT"
          echo "version_tag=$VERSION_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify permanent release APK signature
        run: |
          APKSIGNER="${ANDROID_HOME}/build-tools/34.0.0/apksigner"
          CERT_OUT=$("$APKSIGNER" verify --print-certs "${{ steps.find_apk.outputs.apk_path }}")
          echo "$CERT_OUT"
          if echo "$CERT_OUT" | grep -qi "Android Debug"; then
            echo "::error::APK was signed with an ephemeral Android Debug key instead of the permanent release keystore!"
            exit 1
          fi
          if ! echo "$CERT_OUT" | grep -qi "d4d59c539ae69972afba5327cda0f50145606aa0d35cc6dccb7a820c79de0883"; then
            echo "::error::APK certificate SHA-256 fingerprint does not match the permanent release key!"
            exit 1
          fi
          echo "Verified permanent release certificate (in-place updates enabled)."

      - name: Remove temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/llmnotes-release.jks"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LLMNotes-${{ steps.find_apk.outputs.version_tag }}
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.apk_sha256 }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.apk_sha256 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
